[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-harness"
version = "0.3.0"
description = "Evaluate LLM agents across task suites: traces, statistics, leaderboard."
readme = "README.md"
license = "MIT"
authors = [{ name = "Zdenek Hynek" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.16",
    "agent-eval-harness[serve]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["harness"]
